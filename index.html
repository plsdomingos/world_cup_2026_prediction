    function updateDropdownNames() {
        const sel = document.getElementById('standings-view-select');
        ['p1', 'p2', 'p3', 'p4'].forEach((p, i) => sel.options[i+1].text = "👁️ Previsão: " + document.getElementById(`${p}-name`).value);
    }

    function getStandings(src) {
        let st = {};
        for (let g in groups) st[g] = groups[g].map(t => ({ name: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
        matches.forEach(m => {
            let d = src[m.id];
            if (d && d.g1 !== "" && d.g2 !== "") {
                let g1 = parseInt(d.g1), g2 = parseInt(d.g2), t1 = st[m.group].find(x => x.name === m.t1), t2 = st[m.group].find(x => x.name === m.t2);
                t1.p++; t2.p++; t1.gf += g1; t1.ga += g2; t1.gd = t1.gf - t1.ga; t2.gf += g2; t2.ga += g1; t2.gd = t2.gf - t2.ga;
                if (g1 > g2) { t1.w++; t1.pts += 3; t2.l++; } else if (g1 < g2) { t2.w++; t2.pts += 3; t1.l++; } else { t1.d++; t2.d++; t1.pts += 1; t2.pts += 1; }
            }
        });
        for (let g in st) st[g].sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
        return st;
    }

    function getQ(st) {
        let t3 = []; for(let g in st) if(st[g][2].p > 0) t3.push(st[g][2]);
        t3.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
        let top8 = t3.slice(0,8).filter(x => x.p > 0).map(x => x.name);
        return {
            w: Object.keys(st).map(g => st[g][0].p>0 ? st[g][0].name : null).filter(x=>x),
            r: Object.keys(st).map(g => st[g][1].p>0 ? st[g][1].name : null).filter(x=>x),
            t8: top8,
            all: [...Object.keys(st).map(g => st[g][0].p>0 ? st[g][0].name : null).filter(x=>x), ...Object.keys(st).map(g => st[g][1].p>0 ? st[g][1].name : null).filter(x=>x), ...top8]
        };
    }

    function resolve(ref) {
        if (!ref) return "A Definir";
        if (ref.match(/^[12][A-L]$/)) {
            let pos = parseInt(ref[0]) - 1, grp = ref[1];
            return actualStandings[grp] && actualStandings[grp][pos].p > 0 ? actualStandings[grp][pos].name : `(${ref})`;
        }
        if (ref.startsWith('3_')) {
            let t3 = []; for(let g in actualStandings) t3.push(actualStandings[g][2]);
            t3.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            let top8 = t3.slice(0,8);
            let idx = parseInt(ref.split('_')[1]);
            return top8[idx] && top8[idx].p > 0 ? top8[idx].name : "(Melhor 3º)";
        }
        if (ref.startsWith('W') || ref.startsWith('L')) {
            let pid = 'M' + ref.substring(1), act = state.actual[pid], info = koMatches.find(x => x.id === pid);
            if (!act || act.g1 === "" || act.g2 === "") return `(${ref})`; 
            let g1 = parseInt(act.g1), g2 = parseInt(act.g2), t1 = resolve(info.t1_ref), t2 = resolve(info.t2_ref);
            let adv = g1 > g2 ? 't1' : (g2 > g1 ? 't2' : act.adv);
            let win = adv === 't1' ? t1 : (adv === 't2' ? t2 : `(${ref})`);
            let los = adv === 't1' ? t2 : (adv === 't2' ? t1 : `(${ref})`);
            return ref.startsWith('W') ? win : los;
        }
        return ref;
    }

    window.renderGroups = () => {
        actualStandings = getStandings(state.actual);
        let src = document.getElementById('standings-view-select').value;
        let st = src === 'actual' ? actualStandings : getStandings(state.preds[src]);
        const container = document.getElementById('groups-container');
        container.innerHTML = '';
        for (let g in groups) {
            let rows = st[g].map((t, i) => `<tr class="${i<2?'rank-'+(i+1):i==2?'rank-3':''}"><td>${i+1}. ${t.name}</td><td>${t.p}</td><td>${t.gd}</td><td>${t.pts}</td></tr>`).join('');
            container.innerHTML += `<div class="group-card"><h3>Grupo ${g} ${src!=='actual'?'<small>(Sim)</small>':''}</h3><table class="standings-table"><tr><th>Equipa</th><th>J</th><th>DG</th><th>Pts</th></tr>${rows}</table></div>`;
        }
    }

    function calcPts(m, p) {
        let act = state.actual[m.id], prd = state.preds[p][m.id];
        if (!act || act.g1 === "" || act.g2 === "" || !prd || prd.g1 === "" || prd.g2 === "") return 0;
        let a1 = parseInt(act.g1), a2 = parseInt(act.g2), p1 = parseInt(prd.g1), p2 = parseInt(prd.g2);
        if (a1 === p1 && a2 === p2) return m.isKO ? CONFIG.KO_EXACT[m.phase] : CONFIG.GS_EXACT;
        if ((p1 - p2) === (a1 - a2)) return m.isKO ? CONFIG.KO_GD[m.phase] : CONFIG.GS_GD;
        if (Math.sign(p1 - p2) === Math.sign(a1 - a2)) return m.isKO ? CONFIG.KO_RESULT[m.phase] : CONFIG.GS_RESULT;
        return 0;
    }

    function matchHTML(m) {
        let t1 = m.isKO ? resolve(m.t1_ref) : m.t1, t2 = m.isKO ? resolve(m.t2_ref) : m.t2;
        let act = state.actual[m.id] || {g1:"", g2:"", adv:""}, isTie = m.isKO && act.g1 !== "" && act.g1 === act.g2;
        return `<div class="match-row"><div class="match-info">${m.date} | ${m.time} | ${m.venue} | ID: ${m.id}</div><div class="team-name ${t1.includes('(')?'tbd':''}">${t1}</div><div class="score-box actual"><div class="score-inputs"><input type="number" onchange="window.upA('${m.id}','g1',this.value)" value="${act.g1}">-<input type="number" onchange="window.upA('${m.id}','g2',this.value)" value="${act.g2}"></div>${isTie?`<select class="adv-select" onchange="window.upA('${m.id}','adv',this.value)"><option value="">Passa...</option><option value="t1" ${act.adv=='t1'?'selected':''}>${t1.substring(0,4)}</option><option value="t2" ${act.adv=='t2'?'selected':''}>${t2.substring(0,4)}</option></select>`:''}</div><div class="team-name away ${t2.includes('(')?'tbd':''}">${t2}</div><div style="display:flex;gap:5px;">${['p1','p2','p3','p4'].map(p=>{let pr=state.preds[p][m.id]||{g1:"",g2:"",adv:""};return `<div class="player-pred"><span>${p.toUpperCase()}</span><div class="score-inputs"><input type="number" onchange="window.upP('${p}','${m.id}','g1',this.value)" value="${pr.g1}">-<input type="number" onchange="window.upP('${p}','${m.id}','g2',this.value)" value="${pr.g2}"></div>${m.isKO&&pr.g1!=""&&pr.g1==pr.g2?`<select class="adv-select" onchange="window.upP('${p}','${m.id}','adv',this.value)"><option value="">P...</option><option value="t1" ${pr.adv=='t1'?'selected':''}>T1</option><option value="t2" ${pr.adv=='t2'?'selected':''}>T2</option></select>`:''}<div class="points-awarded">${calcPts(m,p)} pts</div></div>`}).join('')}</div></div>`;
    }

    function renderMatches() {
        const c = document.getElementById('matches-container'); c.innerHTML = '';
        let groupsD = {}; matches.forEach(m => { if(!groupsD[m.date]) groupsD[m.date] = []; groupsD[m.date].push(m); });
        for(let d in groupsD) {
            let id = d.replace(/\//g,'-');
            c.innerHTML += `<div class="collapsible-header" onclick="window.toggleSection('date-${id}')">📅 ${d}</div><div id="date-${id}" class="collapsible-content">${groupsD[d].map(matchHTML).join('')}</div>`;
        }
    }

    function renderKnockouts() {
        const c = document.getElementById('knockouts-container'); c.innerHTML = '';
        let groupsP = {}; koMatches.forEach(m => { if(!groupsP[m.phase]) groupsP[m.phase] = []; groupsP[m.phase].push(m); });
        for(let p in groupsP) {
            let id = p.replace(/\s/g,'-');
            c.innerHTML += `<div class="collapsible-header ${p.includes('Final')?'final-header':''}" onclick="window.toggleSection('phase-${id}')">🏆 ${p}</div><div id="phase-${id}" class="collapsible-content">${groupsP[p].map(matchHTML).join('')}</div>`;
        }
    }

    window.upA = (id, k, v) => { if(!state.actual[id]) state.actual[id]={g1:"",g2:"",adv:""}; state.actual[id][k]=v; window.renderGroups(); renderMatches(); renderKnockouts(); updateLeaderboard(); }
    window.upP = (p, id, k, v) => { if(!state.preds[p][id]) state.preds[p][id]={g1:"",g2:"",adv:""}; state.preds[p][id][k]=v; if(parseInt(id.replace('M',''))<=72){ renderMatches(); if(document.getElementById('standings-view-select').value==p) window.renderGroups(); } else renderKnockouts(); updateLeaderboard(); }

    function updateLeaderboard() {
        actualStandings = getStandings(state.actual); let aQ = getQ(actualStandings);
        let koB = {p1:0, p2:0, p3:0, p4:0};
        [...new Set(koMatches.map(m=>m.phase))].forEach(ph => {
            let sc = {p1:0, p2:0, p3:0, p4:0}, rCount = 0;
            koMatches.filter(m=>m.phase==ph).forEach(m => {
                let act = state.actual[m.id]; if(!act || act.g1==="" || act.g2==="") return;
                let aA = act.g1>act.g2 ? 't1' : (act.g1<act.g2 ? 't2' : act.adv); if(!aA) return; rCount++;
                ['p1','p2','p3','p4'].forEach(p => { let pr = state.preds[p][m.id]; if(pr && (pr.g1>pr.g2?'t1':(pr.g1<pr.g2?'t2':pr.adv)) == aA) sc[p]++; });
            });
            if(rCount > 0) {
                let uSc = [...new Set(Object.values(sc))].sort((a,b)=>b-a);
                ['p1','p2','p3','p4'].forEach(p => { if(sc[p]==uSc[0] && uSc[0]>0) koB[p]+=CONFIG.KO_EXTRA_1ST; else if(sc[p]==uSc[1] && uSc[1]>0) koB[p]+=CONFIG.KO_EXTRA_2ND; });
            }
        });

        let stats = ['p1','p2','p3','p4'].map(p => {
            let gs=0, ko=0; matches.forEach(m=>gs+=calcPts(m,p)); koMatches.forEach(m=>ko+=calcPts(m,p));
            let pS = getStandings(state.preds[p]), pQ = getQ(pS), b=0;
            for(let g in groups) { if(actualStandings[g][0].p>0 && pS[g][0].name==actualStandings[g][0].name) b+=CONFIG.BONUS_WINNER; if(actualStandings[g][1].p>0 && pS[g][1].name==actualStandings[g][1].name) b+=CONFIG.BONUS_RUNNERUP; }
            pQ.t8.forEach(t => { if(aQ.t8.includes(t)) b+=CONFIG.BONUS_BEST3RD; });
            pQ.all.forEach(t => { if(aQ.all.includes(t)) b+=CONFIG.BONUS_QUALIFIED; });
            return { n: document.getElementById(p+'-name').value, gs, b, ko, extra: koB[p], tot: gs+b+ko+koB[p] };
        }).sort((a,b) => b.tot - a.tot);

        document.getElementById('leaderboard-body').innerHTML = stats.map((s,i) => `<tr><td>${i+1}º</td><td>${s.n}</td><td><b>${s.tot}</b></td><td>${s.gs}</td><td>+${s.b}</td><td>${s.ko}</td><td>+${s.extra}</td></tr>`).join('');
    }

    window.saveData = () => {
        state.names = ['p1','p2','p3','p4'].map(p => document.getElementById(p+'-name').value);
        set(dbRef, state).then(() => alert("Dados na Nuvem! ☁️")).catch(e => alert("Erro: " + e));
    }
    window.resetData = () => confirm("Apagar TUDO?") && set(dbRef, null).then(() => location.reload());
</script>
